{% load static %}
{% load compress %}
<!DOCTYPE html>
<html dir="rtl" lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    {% compress css %}
    <link href="{% static 'node_modules/swiper/swiper-bundle.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    {% endcompress %}
    <title>ورود</title>
</head>
<body class="bg-slate-50 font-YekanBakh-Regular text-sm">

<section class="h-screen px-4 flex items-center">
    <div class="container mx-auto max-w-screen-lg">
        <div class="bg-white rounded-2xl overflow-hidden">
            <div class="flex flex-col md:flex-row gap-8">
                <div class="flex-1 p-8 md:p-4 lg:p-20 lg:pb-0">
                    <form action="">
                        <h2 class="text-3xl font-YekanBakh-ExtraBlack my-4">فراموشی رمز عبور</h2>
                        <p class="leading-8">گذرواژه خود را فراموش کرده اید؟ نام کاربری یا ایمیل خود را وارد کنید. یک
                            لینک برای ساختن گذرواژه جدید در ایمیل خود دریافت خواهید کرد.</p>
                        <label class="label">
                            <span class="label-text-alt">ایمیل:</span>
                        </label>
                        <input class="input input-bordered w-full my-2" type="email"/>

                        <button class="btn bg-stone-800 hover:bg-stone-900 text-white w-full my-4">بازگردانی گذرواژه
                        </button>
                    </form>
                </div>
                <div class="hidden md:block">
                    <img alt="" class="bg-cover" src="{% static 'images/pass.jpg' %}">
                </div>
            </div>
        </div>
    </div>
</section>
<script src="https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js"></script>
{% compress js %}
<script src="{% static 'node_modules/swiper/swiper-bundle.min.js' %}"></script>
<script src="{% static 'js/main.js' %}"></script>
{% endcompress %}
</body>
</html>
