services:

  db:
    image: postgres:17
    container_name: postgres
    restart: always

    environment:
      POSTGRES_DB: komail_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  redis:
    image: redis:8-alpine
    container_name: redis

    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: django

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: celery

    command:
      celery -A Komail_Django worker --loglevel=info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - redis

  celery-beat:
    build: .
    container_name: celery-beat

    command:
      celery -A Komail_Django beat --loglevel=info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - redis

  locust:
    image: locustio/locust
    container_name: locust

    volumes:
      - ./locust:/mnt/locust

    command:
      - -f
      - /mnt/locust/locustfile.py
      - --host=http://backend:8000

    ports:
      - "8089:8089"

    depends_on:
      - backend

volumes:
  postgres_data: